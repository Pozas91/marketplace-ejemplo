<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}}</title>
<style>
  :root { --fondo: #ffffff; --texto: #1a1a1a; --borde: #d0d0d0; --error: #b00020; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #121212; --texto: #e8e8e8; --borde: #3a3a3a; --error: #ff6b6b; }
  }
  body { margin: 0; padding: 24px; background: var(--fondo); color: var(--texto);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  button { font: inherit; padding: 6px 12px; cursor: pointer; }
  #diagrama { overflow: auto; border: 1px solid var(--borde); border-radius: 8px; padding: 16px; }
  #diagrama svg { max-width: 100%; height: auto; }
  #error { color: var(--error); white-space: pre-wrap; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>{{TITULO}}</h1>
  <button id="descargar" hidden>Descargar SVG</button>
</header>
<div id="diagrama">Dibujando…</div>
<pre id="error"></pre>

<script type="text/plain" id="fuente">
{{DIAGRAMA}}
</script>

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

  const oscuro = matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: oscuro ? "dark" : "default", securityLevel: "strict" });

  const contenedor = document.getElementById("diagrama");
  const fuente = document.getElementById("fuente").textContent.trim();

  try {
    const { svg } = await mermaid.render("grafico", fuente);
    contenedor.innerHTML = svg;

    const boton = document.getElementById("descargar");
    boton.hidden = false;
    boton.onclick = () => {
      const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
      const enlace = Object.assign(document.createElement("a"), { href: url, download: `${document.title}.svg` });
      enlace.click();
      URL.revokeObjectURL(url);
    };
  } catch (e) {
    document.getElementById("dgrafico")?.remove();
    contenedor.hidden = true;
    document.getElementById("error").textContent = `Error de sintaxis Mermaid:\n${e.message}`;
  }
</script>
</body>
</html>
